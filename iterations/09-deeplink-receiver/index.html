<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="color-scheme" content="dark">
<title>The Line Wafer — iteration 09, the deep-link receiver</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="stage" aria-label="Every permanently numbered line of code in the estate, placed by its own number."></canvas>

<header id="bar">
  <span id="wordmark">THE LINE WAFER · RECEIVER</span>
  <span id="count" class="dim">loading the numbered database…</span>
</header>

<form id="beam" autocomplete="off">
  <input id="a" inputmode="numeric" pattern="[0-9]*" placeholder="line number" aria-label="line number to fly to">
  <input id="b" inputmode="numeric" pattern="[0-9]*" placeholder="connect to…" aria-label="second line number to connect to">
  <button id="go" type="submit">FLY</button>
</form>

<div id="leftcol">
<aside id="linkcard" hidden aria-live="polite"></aside>

<section id="emit" hidden>
  <button id="emitToggle" type="button">EMIT</button>
  <div id="emitBody" hidden>
    <div class="egroup">BUILD A LINK · buildDeepLink</div>
    <div class="erow">
      <input id="emitLine" inputmode="numeric" placeholder="line" aria-label="line for the emitted link">
      <input id="emitTo" inputmode="numeric" placeholder="to" aria-label="second line for the emitted link">
    </div>
    <select id="emitLayers" multiple size="5" aria-label="layers to carry in the emitted link"></select>
    <div class="egroup">galaxies-wafers <button id="emitCopy" type="button">COPY</button></div>
    <div id="emitA" class="eurl"></div>
    <div class="egroup">line-wafer-202609151339 · carries no layers</div>
    <div id="emitB" class="eurl"></div>
    <div id="emitReceivers" class="estat">checking engine/receivers.json…</div>
  </div>
</section>
</div>

<section id="panel" hidden>
  <button id="close" type="button" aria-label="close">✕</button>
  <div id="panelbody"></div>
</section>

<footer id="foot">
  <span id="prov" class="dim">provenance loading</span>
  <span id="hint" class="dim">drag to steer · pinch or scroll to focus the beam · tap a line</span>
  <a id="proofs" href="../../proof/">check every claim on this page</a>
</footer>

<noscript><p class="dim" style="padding:1rem">This surface is drawn from the numbered database at run time, so it needs JavaScript. Nothing here is typed into the page.</p></noscript>

<script type="module" src="receiver.mjs"></script>
<script type="module" src="app.mjs"></script>
<script type="module" src="layers-panel.mjs"></script>
</body>
</html>
